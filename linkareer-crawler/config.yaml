# 링커리어 크롤러 설정
# 구글시트를 쓰면 아래 목록(기관/분야/키워드)은 첫 실행 때 시트 '설정' 탭으로 옮겨지고,
# 그 뒤로는 시트의 '설정' 탭이 기준입니다. 여기 목록은 엑셀 전용 모드에서만 쓰입니다.
# (대소문자 무시, 부분일치)

crawl:
  pages_per_list: 80         # 목록 최대 페이지 (모집 중인 공고를 끝까지 봄. 마지막 페이지에서 자동으로 멈춤)
  request_delay_sec: 1.5     # 요청 간 대기 (서버 부담 줄이기)
  fetch_detail: true         # 상세 페이지 본문까지 읽어서 키워드 매칭
  poster_ocr: true           # 본문이 거의 없는 공고는 포스터 이미지 글자를 무료 OCR로 읽음
  # 목록 URL 뒤에 붙는 쿼리. 실제 파라미터명은 사이트 확인 후 조정 필요
  list_query: "filterType=CATEGORY&orderBy_direction=DESC&orderBy_field=CREATED_AT"
  lists:
    공모전: /list/contest
    대외활동: /list/activity

# 요약 설정. GEMINI_API_KEY(무료) → ANTHROPIC_API_KEY(유료) → 본문 발췌 순으로 사용
summary:
  gemini_models:             # 앞에서부터 시도. 결제 필요(402)·없는 모델(404)이면 다음 후보, 다 안 되면 API에서 Flash 모델을 찾아 씀
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
    - gemini-flash-latest
    - gemini-flash-lite-latest
  gemini_interval_sec: 7     # 무료 등급 분당 요청 제한 대비 요청 간격
  use_claude: true
  model: claude-opus-5-5     # 더 저렴하게: claude-haiku-4-5 (정확도는 다소 낮음)
  max_per_run: 40            # 한 번 실행에 AI 요약 최대 건수 (무료 한도·비용 상한)
  backfill_per_run: 30       # 요약이 빈 기존 행을 한 번에 몇 건까지 채울지

# 링커리어 분야가 이 중 하나면 +4점(단독으로 추천). 시트 '설정' 탭의 '관심분야'로도 추가 가능
categories:
  - 요리/식품
# +2점(단독으로는 검토). 시트 '설정' 탭의 '참고분야'로도 추가 가능
sub_categories:
  - 의료/보건
  - 체육/헬스

scoring:
  recommend_threshold: 4     # 이 점수 이상 → "추천"
  review_threshold: 2        # 이 점수 이상 → "검토" (미만은 저장 안 함)

