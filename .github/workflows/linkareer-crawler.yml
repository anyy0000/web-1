name: 링커리어 식품·건강 공고 수집

on:
  schedule:
    # 매주 월·목 오전 8:47 KST (= 일·수 23:47 UTC). GitHub 사정으로 수십 분 늦게 돌 수 있음
    - cron: "47 23 * * 0,3"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkareer-crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: linkareer-crawler/requirements.txt
      - run: pip install -r requirements.txt
      - name: 수집 실행
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python main.py
      - name: 이번 실행 결과 엑셀 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkareer-${{ github.run_number }}
          path: linkareer-crawler/output/
          if-no-files-found: ignore
          retention-days: 30
