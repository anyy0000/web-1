name: 링커리어 식품·건강 공고 수집

on:
  schedule:
    # 매주 월·목 오전 8:47 KST (= 일·수 23:47 UTC). GitHub 사정으로 수십 분 늦게 돌 수 있음
    - cron: "47 23 * * 0,3"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행

concurrency:  # 두 번 눌러도 동시에 돌지 않게 (시트를 동시에 덮어쓰는 것 방지)
  group: linkareer-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 첫 실행이나 조건 변경 후 재검사 때는 공고 수백 건을 읽어 오래 걸림
    defaults:
      run:
        working-directory: linkareer-crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: linkareer-crawler/requirements.txt
      - name: 포스터 OCR(무료) 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor
      - run: pip install -r requirements.txt
      - name: 수집 실행
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 요약은 크롤러가 무료 발췌로 먼저 채우고, 이후 Claude 루틴이 문장으로 다시 씁니다 (CLAUDE_SUMMARY.md).
          # Gemini/Claude API로 바로 요약하려면 아래 줄을 추가하세요 (선택):
          #   GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
      - name: 이번 실행 결과 엑셀 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkareer-${{ github.run_number }}
          path: linkareer-crawler/output/
          if-no-files-found: ignore
          retention-days: 30
